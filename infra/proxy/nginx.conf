# Edge reverse proxy: the ONLY public entry point of the compose stack (port 3000 on the host).
#
# Why it exists: Next.js rewrites forward a client-supplied X-Forwarded-For verbatim and add nothing
# (verified on Next 15.5). Behind them the API either trusted a forged address (per-IP limit bypass) or saw
# every user as the web container (one global bucket: 10 bad logins from anyone lock out every login).
# This proxy OVERWRITES X-Forwarded-For with the real TCP peer, so with TRUSTED_PROXY_HOPS=1 the API keys
# per-IP limits on the true client address and anything the client sent is discarded.
#
# Routing: /api/* -> api directly (never via Next.js); everything else -> web.
# If you add another proxy/load balancer in front of this one, append instead of overwrite
# ($proxy_add_x_forwarded_for) and raise TRUSTED_PROXY_HOPS to match.

worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's embedded DNS; resolving per request lets the proxy start before api/web are up
  # and follow container restarts (new IPs) without a reload.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server_tokens off;
  client_max_body_size 10m;          # raise together with UPLOAD_* limits when PDF upload lands
  proxy_read_timeout 60s;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 80;

    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite: client-supplied values are discarded
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # NO proxy_set_header inside location blocks: nginx drops EVERY inherited proxy_set_header in a block that
    # declares its own. That once silently removed Host/X-Forwarded-* for "/" (Next.js then built redirects to
    # the internal web origin). tests/unit/test_edge_proxy_config.py enforces this.
    location /api/ {
      proxy_pass $api_upstream;   # variable + no URI part => original request URI is passed unchanged
      proxy_buffering off;        # keeps future SSE progress streams responsive
    }

    location / {
      proxy_pass $web_upstream;
    }
  }
}
