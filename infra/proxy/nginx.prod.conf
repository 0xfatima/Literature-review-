# Production edge proxy (Phase 15): TLS termination, HTTP->HTTPS redirect, ACME webroot, HSTS.
# Certificates: /etc/nginx/certs/fullchain.pem and privkey.pem (docs/runbooks/deployment.md#tls).
# Same routing and header rules as the development proxy (infra/proxy/nginx.conf); /internal/* is never forwarded.
worker_processes auto;
events { worker_connections 2048; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;
  client_max_body_size 10m;
  proxy_read_timeout 60s;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 80;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    set $api_upstream http://api:8000;
    set $web_upstream http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite: client-supplied values are discarded
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location = /internal { return 404; }
    location /internal/ { return 404; }     # operator endpoints are reached on the internal network only
    location ~ "^/api/v1/projects/[0-9a-fA-F-]{36}/documents/?$" {
      client_max_body_size 55m;
      proxy_pass $api_upstream;
      proxy_buffering off;
    }
    location /api/ {
      proxy_pass $api_upstream;
      proxy_buffering off;
    }
    location = /healthz { proxy_pass $api_upstream; }   # liveness for external uptime checks (no data)
    location / {
      proxy_pass $web_upstream;
    }
  }
}
