# Phase 14: weekly update PRs. Lockfiles are regenerated by the "Generate lockfiles (manual)" workflow; a Dependabot
# PR that changes a manifest must be followed by that workflow before it can pass `verify_locks.py`.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
