name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: srs, POSTGRES_PASSWORD: srs_ci, POSTGRES_DB: srs_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U srs -d srs_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      REQUIRE_INTEGRATION: "1"     # a missing DB FAILS the run; integration tests can never be silently skipped
      DATABASE_URL: postgresql+psycopg://srs:srs_ci@localhost:5432/srs_test
      TEST_DATABASE_URL: postgresql+psycopg://srs:srs_ci@localhost:5432/srs_test
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_OCR_TESTS: "1"       # the real-Tesseract test must RUN in CI (it is skipped locally only if tesseract is absent)
    steps:
      - uses: actions/checkout@v4
      - name: OCR engine for the PDF tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements.lock.txt }
      - name: Lockfile must exist (dependencies are pinned, never floating)
        run: test -f requirements.lock.txt
      - run: pip install -c requirements.lock.txt -e ".[dev]"
      - run: pip check
      - name: Lockfiles are exact, complete (transitive) and consistent with manifests
        run: python scripts/verify_locks.py
      - name: Stdlib-only tests (fast, no services)
        run: python scripts/run_stdlib_tests.py
      - run: ruff check services/api
      - run: ruff format --check services/api
      - run: mypy
      - name: Migrations apply on a clean database (up, down, up) and models match migrations
        working-directory: services/api
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Unit + integration tests with coverage (skips are failures)
        run: |
          pytest services/api/tests -rs --junitxml=pytest.xml --cov=app --cov-report=term-missing --cov-report=xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r = ET.parse("pytest.xml").getroot(); s = r if r.tag == "testsuite" else r.find("testsuite")
          t, sk = int(s.get("tests")), int(s.get("skipped"))
          print(f"tests={t} skipped={sk}")
          assert sk == 0 and t >= 510, "tests were skipped or too few executed"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-evidence
          path: |
            coverage.xml
            pytest.xml
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Lockfile must exist
        run: test -f package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
        env: { API_BASE_URL: "http://localhost:8000" }

  e2e:
    runs-on: ubuntu-latest   # independent of backend/web so E2E results are never hidden by an earlier failure
    steps:
      - uses: actions/checkout@v4
      - name: Lockfiles must exist (no floating dependencies in images)
        run: test -f requirements.lock.txt && test -f apps/web/package-lock.json
      - name: Start stack
        run: |
          cp .env.example .env
          # The browser suite signs in ~15-30 times a minute from one address (more with retries): raise the login
          # limit for this stack only; the drills are told the same number via DRILL_LOGIN_LIMIT.
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=srs_ci/; s/^RATE_LIMIT_REGISTER_PER_HOUR=.*/RATE_LIMIT_REGISTER_PER_HOUR=500/; s/^RATE_LIMIT_LOGIN_PER_MIN=.*/RATE_LIMIT_LOGIN_PER_MIN=100/' .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS localhost:8000/readyz >/dev/null && curl -fsS localhost:8000/healthz/worker >/dev/null \
              && curl -fsS -o /dev/null localhost:3000/login && break
            sleep 4
          done
          curl -fsS localhost:8000/readyz && curl -fsS localhost:8000/healthz/worker
          curl -fsS -o /dev/null -w "web via edge proxy: %{http_code}\n" localhost:3000/login
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:3000 PLAYWRIGHT_JSON_OUTPUT_NAME=pw.json npx playwright test --reporter=json,list,html
          node -e "const s=require('./pw.json').stats; console.log(s); if(s.unexpected||s.skipped||s.flaky||s.expected<14) process.exit(1)"
      - name: Live drills (ownership, CSRF, audit immutability, session revocation, IP limit, broker outage, worker SIGKILL, restart persistence)
        run: |
          sleep 65
          DRILL_LOGIN_LIMIT=100 python scripts/drills.py run all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color | tail -200

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lockfiles must exist
        run: test -f requirements.lock.txt && test -f apps/web/package-lock.json
      - run: docker build -f infra/docker/api.Dockerfile -t srs-api .
      - run: docker build -f infra/docker/worker.Dockerfile -t srs-worker .
      - run: docker build -f infra/docker/web.Dockerfile -t srs-web .

  # Phase 15: deploy the PRODUCTION compose file with the documented script, then smoke-test it over TLS, run the
  # backup/restore exercise and scrape the internal metrics. Independent of the other jobs.
  deploy-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lockfiles must exist
        run: test -f requirements.lock.txt && test -f apps/web/package-lock.json
      - name: Shell scripts are executable in git (a lost +x bit fails with exit 126)
        run: |
          bad="$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')"
          if [ -n "$bad" ]; then echo "not executable in git (fix: git update-index --chmod=+x <file>):"; echo "$bad"; exit 1; fi
      - name: Production configuration, secrets and a self-signed certificate
        run: |
          cp .env.production.example .env.production
          sed -i 's#https://reviews.example.org#https://localhost#g; s#^SRS_VERSION=.*#SRS_VERSION=ci#' .env.production
          bash scripts/gen-secrets.sh
          mkdir -p infra/proxy/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost \
            -keyout infra/proxy/certs/privkey.pem -out infra/proxy/certs/fullchain.pem
          chmod 644 infra/proxy/certs/privkey.pem
      - name: Deploy with scripts/deploy.sh (pre-flight, build, migrate, start, smoke test over HTTPS)
        run: bash scripts/deploy.sh --insecure
      - name: Backup and restore exercise (rows AND uploaded files come back)
        run: bash scripts/restore-drill.sh https://localhost --insecure
        env: { COMPOSE: "docker compose --env-file .env.production -f docker-compose.prod.yml" }
      - name: Smoke test again after the restore
        run: python3 scripts/smoke.py --base https://localhost --insecure
      - name: Internal metrics answer on the private network only, with the token
        run: |
          C="docker compose --env-file .env.production -f docker-compose.prod.yml"
          $C exec -T api python -c "import urllib.request as u; t=open('/run/secrets/metrics_token').read().strip(); r=u.Request('http://localhost:8000/internal/metrics', headers={'Authorization': 'Bearer '+t}); b=u.urlopen(r).read().decode(); print(b[:1500]); assert 'srs_jobs_finished' in b and 'srs_http_request_duration_seconds_bucket' in b"
      - if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --no-color | tail -300

  # Phase 14: known-vulnerability scan of the locked dependency sets. The scanners are pinned (never floating) and
  # installed outside the project lockfile because they are CI tools, not application dependencies.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Python dependencies (requirements.lock.txt) have no known vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.9.0
          pip-audit --requirement requirements.lock.txt --no-deps --disable-pip --progress-spinner off
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - name: Web runtime dependencies (package-lock.json) have no high/critical advisories
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  # Branch protection should require ONLY this job. A skipped, cancelled or failed job is never green.
  ci-gate:
    if: always()
    needs: [backend, web, e2e, docker-build, dependency-audit, deploy-verify]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::non-success result: $r (skipped counts as failure)"; exit 1; }
          done
