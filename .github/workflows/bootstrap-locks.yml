# Manual, one-click generation of the lockfiles on a network-enabled runner. It does NOT relax any CI requirement:
# ci.yml still fails when the lockfiles are absent. This workflow just produces them.
#
# How to use: Actions tab -> "Generate lockfiles (manual)" -> Run workflow (on the branch you want).
# It pushes branch chore/lockfiles-<run id>; open a PR from it (a human-opened PR triggers ci.yml; pushes made with
# GITHUB_TOKEN do not). It also uploads the files + an actions-version report as an artifact.
name: Generate lockfiles (manual)
on: workflow_dispatch

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Resolve and pin everything (also runs scripts/verify_locks.py)
        run: scripts/lock.sh

      - name: Prove the committed locks work with the SAME commands CI and Docker use
        run: |
          python -m venv /tmp/proof
          /tmp/proof/bin/pip install -c requirements.lock.txt -e ".[dev]"
          /tmp/proof/bin/pip check
          /tmp/proof/bin/python scripts/verify_locks.py
          cd apps/web && rm -rf node_modules && npm ci

      - name: Actions versions and declared runtimes (informational)
        run: python scripts/check_actions.py | tee actions-report.md
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: lockfiles-and-reports
          path: |
            requirements.lock.txt
            apps/web/package-lock.json
            docs/runbooks/LOCK_ENVIRONMENT.txt
            actions-report.md
          if-no-files-found: error

      - name: Push branch with the generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "chore/lockfiles-${{ github.run_id }}"
          git add requirements.lock.txt apps/web/package-lock.json docs/runbooks/LOCK_ENVIRONMENT.txt
          git commit -m "chore: add resolved lockfiles (generated by scripts/lock.sh, run ${{ github.run_id }})"
          git push origin HEAD
